server {
    listen 127.0.0.1:8080;
    server_name a.com b.com c.com;
    root /var/www/site1;
    index index.php index.html /var/www/fallback.html;
    error_page 403 404 405 /error.html;
    client_max_body_size 1G;

    location /api {
        allow_methods GET POST;
        return 301 /new-api;
        autoindex off;
    }

    location /cgi-bin {
        cgi .php /usr/bin/php-cgi;
        cgi .py /usr/bin/python3;
        root /var/www/cgi;
        upload_store /tmp/uploads;
    }
}

server {
    listen 9090 default_server;
    server_name secondary.com;
    root /var/www/site2;
    index index.html;

    location /images {
        autoindex on;
        index default.jpg;
    }
}

server {
    listen 8081;
    server_name tertiary.com;
    root /var/www/site3;
    index index.html;
}
