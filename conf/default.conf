server {
    listen 8080;
    server_name localhost;
    root html;
    index index.py index.php index.html;
    client_max_body_size 10M;

    location / {
        allow_methods GET POST;
        autoindex on;
        cgi .py /usr/bin/python3;
        cgi .php /usr/bin/php-cgi;
    }

    location /upload/ {
        allow_methods GET POST DELETE;
        autoindex on;
        upload_store /upload/;
    }

    location /old-page/ {
        return 301 /new-page/;
    }
}
